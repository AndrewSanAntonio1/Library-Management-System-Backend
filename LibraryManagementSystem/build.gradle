plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'
description = 'LibraryManagementSystem'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters - Core Framework Dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA for database operations with Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Bean validation with Hibernate Validator
    implementation 'org.springframework.boot:spring-boot-starter-webmvc' // Spring MVC for REST API development
    implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security for authentication and authorization

    // JWT Dependencies - Token-based Authentication
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7' // JWT API for token creation and parsing
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7' // JWT implementation
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7' // JWT Jackson integration for JSON processing

    // MapStruct - Object Mapping
    implementation 'org.mapstruct:mapstruct:1.6.3' // MapStruct for DTO to Entity mapping

    // Lombok - Code Generation
    compileOnly 'org.projectlombok:lombok' // Lombok for reducing boilerplate code (getters, setters, etc.)
    annotationProcessor 'org.projectlombok:lombok' // Lombok annotation processor
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3' // MapStruct annotation processor
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0' // Lombok MapStruct binding

    // Database Driver
    runtimeOnly 'com.mysql:mysql-connector-j' // MySQL JDBC driver

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // Spring Boot test starter
    testImplementation 'org.springframework.security:spring-security-test' // Spring Security test support
    testCompileOnly 'org.projectlombok:lombok' // Lombok for test classes
    testAnnotationProcessor 'org.projectlombok:lombok' // Lombok annotation processor for tests
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3' // MapStruct annotation processor for tests
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // JUnit platform launcher
}

tasks.named('test') {
    useJUnitPlatform()
}
